# ===================================
# A股自选股智能分析系统 - Docker Compose
# ===================================
# 
# Linux VPS 使用方式（OpenD 在宿主机 loopback 常驻）:
#   盘中 FastAPI/提示器: docker compose -f ./docker/docker-compose.yml up -d server
#   可选传统定时分析:   docker compose -f ./docker/docker-compose.yml --profile analyzer up -d analyzer
#   完整说明: New-docs/deployment/intraday-cloud.md

name: daily-stock-analysis

x-common: &common
  build:
    context: ..
    dockerfile: docker/Dockerfile
  restart: unless-stopped
  stop_grace_period: 60s

  # 环境变量只注入进程；不要再把含密钥的 .env 挂进容器文件系统。
  env_file:
    - ../.env

  volumes:
    - ../data:/app/data
    - ../logs:/app/logs
    - ../reports:/app/reports
    - ../strategies:/app/strategies:ro
    # 如需覆盖前端静态资源，可挂载本地 static 目录
    # - ../static:/app/static:ro

  environment:
    - TZ=America/New_York

    # 本 Compose 文件面向 Linux VPS：host networking 让容器能通过
    # 127.0.0.1 访问仅绑定宿主机 loopback 的 OpenD，避免暴露 11111。
    - WEBUI_HOST=127.0.0.1
    # API_PORT 从 .env 文件读取，无需在此硬编码

    # 代理设置（如果需要）
    # - http_proxy=http://host.docker.internal:10809
    # - https_proxy=http://host.docker.internal:10809
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  # 定时任务模式
  analyzer:
    <<: *common
    container_name: stock-analyzer
    profiles: ["analyzer"]
    command: ["python", "main.py", "--schedule"]
    # analyzer 不提供 HTTP；其启停由进程退出码与 restart policy 管理。
    healthcheck:
      disable: true
    network_mode: host

  # FastAPI 模式
  server:
    <<: *common
    container_name: stock-server
    # 必须保持单进程/单 worker：盘中 scheduler、动量历史和快重试是进程内状态。
    command: ["python", "-m", "uvicorn", "server:app", "--host", "127.0.0.1", "--port", "${API_PORT:-8000}", "--workers", "1"]
    # Linux host networking 使 127.0.0.1 同时可达宿主机 OpenD；API 也只在
    # loopback 暴露。远程 Web 访问请走 SSH tunnel、VPN 或受保护的反向代理。
    network_mode: host
